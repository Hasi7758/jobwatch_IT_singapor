# ============================================================
#  新加坡 IT 职位监控配置(Cloud / DevOps / Platform / AI / Software Engineer)
#  面向 1 年左右工作经验:不要 Senior/Lead 等资深岗,不要 Data 类岗位。
#
#  匹配规则:只看职位名,整词匹配(前后不能紧贴字母数字)。
#    · "lead" 命中 "Lead Engineer" / "Tech Lead",不会误伤 "Leadership Programme"
#    · "data" 命中 "Data Engineer",不会误伤 "Database"(所以 database 另列)
#  exclude 优先级高于 include。
# ============================================================

keywords:
  include:
    # —— Cloud ——
    - cloud engineer
    - cloud infrastructure engineer
    - cloud platform engineer
    - cloud operations engineer
    - cloud support engineer
    - cloud support associate
    - cloud developer
    - cloud native engineer
    - cloud specialist
    - cloud consultant
    - cloud administrator
    - cloud ops
    - cloudops
    - aws engineer
    - azure engineer
    - gcp engineer
    # —— DevOps / SRE ——
    - devops
    - dev ops
    - devsecops
    - site reliability
    - sre
    - reliability engineer
    - release engineer
    - build engineer
    - ci/cd engineer
    - kubernetes engineer
    # —— Platform / Infra ——
    - platform engineer
    - platform engineering
    - infrastructure engineer
    - infra engineer
    # —— AI ——
    - ai engineer
    - a.i. engineer
    - ai/ml engineer
    - ai software engineer
    - ai application engineer
    - ai developer
    - applied ai
    - machine learning engineer
    - ml engineer
    - mlops
    - llm engineer
    - genai engineer
    - generative ai engineer
    - nlp engineer
    - computer vision engineer
    - deep learning engineer
    # —— Software ——
    - software engineer
    - software developer
    - software development engineer
    - application developer
    - backend engineer
    - back-end engineer
    - back end engineer
    - backend developer
    - frontend engineer
    - front-end engineer
    - frontend developer
    - front end developer
    - full stack
    - full-stack
    - fullstack
    - web developer
    - java developer
    - python developer
    - golang developer
    - .net developer
    - dot net developer
    - c# developer
    - c++ developer
    - node.js developer
    - react developer
    - mobile developer
    - android developer
    - ios developer
    - developer                 # 兜底:Java/Salesforce/RPA Developer 等各种写法
    - programmer
    - programmer analyst
    - sde
    - technology analyst        # 银行/金融机构的应届-初级技术岗常用抬头
    - technology associate
    - technology graduate

  exclude:
    # —— 资深岗:1 年经验不看 ——
    - senior
    - sr
    - sr.
    - snr
    - lead
    - leader
    - principal
    - staff
    - manager
    - head
    - director
    - vice president
    - vp
    - avp
    - chief
    - architect
    - distinguished
    - fellow
    - expert
    - iii
    - iv
    # —— Data 类:不要 ——
    - data
    - database
    - dba
    - analytics
    - business intelligence
    - power bi
    - bi developer
    - etl
    - scientist
    # —— 实习/学生:已有 1 年经验,不看 ——
    - intern
    - interns
    - internship
    - trainee
    - apprentice
    - student
    - part-time
    - part time
    # —— 非工程/噪音 ——
    - sales
    - pre-sales
    - presales
    - marketing
    - recruiter
    - recruitment
    - trainer
    - lecturer
    - professor
    - instructor
    - tutor
    - teacher
    - postdoc
    - phd
    - business developer
    - business development
    - property developer
    - cnc
    - plc
    - hardware
    - mechanical
    - electrical
    - civil
    - structural
    - hvac
    - facilities

# ---------- 地点:整个新加坡 ----------
location:
  terms: ["singapore", "sg", "singapura"]
  allow_remote: false     # true 会把 GitLab 等公司标为 "Remote" 的全球岗也放进来,噪音大
  plz_prefixes: []

# ---------- MyCareersFuture 官方接口 ----------
mycareersfuture:
  enabled: true
  pages: 6          # 每页100条;每个关键词最多取 600 条
  queries:
    - "cloud engineer"
    - "devops engineer"
    - "site reliability engineer"
    - "platform engineer"
    - "infrastructure engineer"
    - "ai engineer"
    - "machine learning engineer"
    - "software engineer"
    - "software developer"
    - "backend developer"
    - "full stack developer"
    - "java developer"
    - "application developer"
    - "junior software engineer"
    - "associate software engineer"

# ---------- 数据清洗 ----------
filters:
  max_posted_age_days: 365

# ---------- 页面显示 ----------
display:
  max_age_days: 5
  recent_days: 2
  # 整体隐藏带这些标签的岗位(仍会入库,删掉这一行就重新显示)。
  # 政府与公共部门:GovTech / DSTA / ST Engineering / 各部委,多数只收公民或 PR,走 EP 的不看。
  hide_tags:
    - 政府与公共部门

# ---------- 推送(可选;GitHub Actions 里用 Secrets 注入,不用改这里)----------
telegram:
  enabled: false
  bot_token: ""
  chat_id: ""

open_browser: true
