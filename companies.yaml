# ============================================================
# 对照表:地址栏域名 -> ats 字段
#   boards.greenhouse.io/xxx  或 job-boards.greenhouse.io/xxx -> ats: greenhouse, slug: xxx
#   jobs.lever.co/xxx                                        -> ats: lever,      slug: xxx
#   jobs.smartrecruiters.com/xxx                             -> ats: smartrecruiters, slug: xxx
#   jobs.ashbyhq.com/xxx                                     -> ats: ashby,      slug: xxx
#   apply.workable.com/xxx                                   -> ats: workable,   slug: xxx
#   xxx.recruitee.com                                        -> ats: recruitee,  slug: xxx
#   xxx.wdN.myworkdayjobs.com/SITE/...                       -> ats: workday,
#        url: https://xxx.wdN.myworkdayjobs.com/wday/cxs/xxx/SITE/jobs   search: Singapore
#   careers.xxx.com/job/...(Phenom 平台,页面底部有 Phenom 字样)-> ats: phenom, url: https://careers.xxx.com, location: Singapore
#
# 没有公开接口的(Amazon / Google / Microsoft / Apple / Meta / Shopee / Sea / DBS / OCBC / UOB /
# 银行 / NCS / Accenture 等)靠 MyCareersFuture 覆盖:按公平考量框架,多数要申请 EP 的岗位
# 必须先在 MCF 公开招聘 14 天,所以大公司的岗位基本不会漏。
# ============================================================
